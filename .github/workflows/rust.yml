name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install desktop build dependencies
      # yonro-app links GPUI. Linux needs the X11 and Wayland client libraries.
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy (all targets, warnings allowed)
      # Baseline carries pedantic warnings, so this gates on errors only.
      run: cargo clippy --workspace --all-targets
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
