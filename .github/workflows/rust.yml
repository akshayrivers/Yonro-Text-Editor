name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Tauri system dependencies
      # Linking yonro-gui (Tauri/wry) on Linux needs the WebKitGTK stack.
      # List mirrors the Tauri v2 prerequisites for Ubuntu.
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy (all targets, warnings allowed)
      # Baseline carries pedantic warnings, so this gates on errors only.
      run: cargo clippy --workspace --all-targets
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Set up Node for UI gate checks
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Check UI scripts
      run: for f in crates/yonro-gui/ui/*.js; do node --check "$f" || exit 1; done
    - name: Check adapter seam (only core.js touches Tauri)
      run: test "$(grep -l '__TAURI__' crates/yonro-gui/ui/*.js | wc -l)" -eq 1 && grep -l '__TAURI__' crates/yonro-gui/ui/*.js
    - name: Check no hardcoded colors outside themes
      run: "! grep -nE '#[0-9a-fA-F]{3,8}\\b|rgba?\\(' crates/yonro-gui/ui/*.js crates/yonro-gui/ui/index.html crates/yonro-gui/ui/styles.css"
