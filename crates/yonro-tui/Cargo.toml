[package]
name = "yonro-tui"
version = "1.0.0"
edition = "2021"

[dependencies]
yonro-core = { path = "../yonro-core" }
arboard = "3.6"
crossterm = "0.27.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
tempfile = "3.8"
crossbeam-channel = "0.5.17"
ropey = "1.6.1"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bin]]
name = "yonro"
path = "src/main.rs"

[[bench]]
name = "layout_and_pane_benchmarks"
harness = false

[[bench]]
name = "command_and_view_benchmarks"
harness = false

[[bench]]
name = "plugin_benchmarks"
harness = false

[[bench]]
name = "editor_e2e_benchmarks"
harness = false

[[bench]]
name = "syntax_and_search_benchmarks"
harness = false
